!on&&React.createElement("div",{style:{padding:"20px 4px 8px"}},React.createElement("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:14}},React.createElement(Avi,{who:"eco",sz:46}),React.createElement("div",null,React.createElement("div",{style:{fontFamily:"'Lilita One',sans-serif",fontSize:21,color:"#145e6e"}},"Soy Eco"),React.createElement("div",{style:{fontSize:12.5,color:"#6b8a92",marginTop:2,fontWeight:600}},"Tu asistente para pensar, no para copiar"))),React.createElement("div",{style:{fontSize:13.5,color:"#2a3a3e",lineHeight:1.65,maxWidth:340,marginBottom:16}},"Te ayudo a desbloquear tareas, pensar mejor y mejorar tus textos. Pero la respuesta la construyes tú."),React.createElement("div",{style:{padding:"10px 14px",borderRadius:10,background:"linear-gradient(135deg,#faf3e0,#f5ead0)",fontSize:12,color:"#5a4a2a",fontWeight:600,textAlign:"center"}},"Ejemplo: ",React.createElement("span",{style:{fontStyle:"italic",color:"#7a6a4a"}},'"No entiendo la pregunta 3"'))),

React.createElement("nav",{style:{background:"#fff",borderTop:"1px solid rgba(20,94,110,.08)",padding:"10px 14px 14px"}},
React.createElement("div",{style:{display:"flex",gap:8,marginBottom:8}},Object.values(MODES).map(mo=>React.createElement("button",{key:mo.id,onClick:()=>setMode(mo.id),style:{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px 10px",minHeight:48,border:"none",borderRadius:24,background:mode===mo.id?(mo.id==="pista"?"#fdf0eb":mo.id==="revisa"?"#edf7ed":"#edf5f7"):"#f7f5ef",cursor:"pointer",flex:1,minWidth:0}},React.createElement("span",{style:{fontSize:16}},mo.emoji),React.createElement("span",{style:{fontSize:12,fontWeight:700,color:mode===mo.id?mo.color:"#5a6a6e",fontFamily:"'Nunito',sans-serif"}},mo.label)))),
